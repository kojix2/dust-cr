name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ubuntu, macos]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu'
        run: sudo apt-get update -y
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - run: shards install
      - run: crystal tool format --check src spec
      - run: crystal spec
      - run: crystal run lib/ameba/bin/ameba.cr -- src spec
